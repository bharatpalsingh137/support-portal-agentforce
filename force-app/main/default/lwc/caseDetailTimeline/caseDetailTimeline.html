<template>
    <lightning-card title={cardTitle} icon-name="standard:timeline">
        <template lwc:if={record}>
            <span slot="actions" class={statusBadgeClass} data-id="status">{record.Status}</span>
        </template>

        <div class="slds-p-horizontal_medium">
            <template lwc:if={isLoading}>
                <div class="slds-is-relative slds-p-around_large">
                    <lightning-spinner alternative-text="Loading case" size="small"></lightning-spinner>
                </div>
            </template>

            <template lwc:elseif={error}>
                <p class="slds-text-color_error" data-id="error">{error}</p>
            </template>

            <template lwc:elseif={record}>
                <p class="slds-text-heading_small slds-m-bottom_x-small">{record.Subject}</p>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                    {record.Product_Category__c} · {record.Priority} priority
                </p>

                <ul class="slds-timeline">
                    <template for:each={timelineItems} for:item="item">
                        <li key={item.id} class="slds-m-bottom_small">
                            <div class={item.cssClass}>
                                <div class="slds-media">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name={item.iconName} size="x-small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <div class="slds-grid slds-grid_align-spread">
                                            <span class="slds-text-title_bold">{item.title}</span>
                                            <lightning-formatted-date-time
                                                class="slds-text-body_small slds-text-color_weak"
                                                value={item.timestamp}
                                                year="numeric"
                                                month="short"
                                                day="2-digit"
                                                hour="2-digit"
                                                minute="2-digit"
                                            ></lightning-formatted-date-time>
                                        </div>
                                        <template lwc:if={item.author}>
                                            <p class="slds-text-body_small slds-text-color_weak">{item.author}</p>
                                        </template>
                                        <template lwc:if={item.body}>
                                            <p class="slds-m-top_xx-small">
                                                <lightning-formatted-text value={item.body}></lightning-formatted-text>
                                            </p>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>

                <template lwc:if={canComment}>
                    <lightning-textarea
                        label="Add a reply"
                        value={newComment}
                        max-length="4000"
                        placeholder="Share an update or answer the support team's question"
                        onchange={handleCommentChange}
                    ></lightning-textarea>
                    <div class="slds-m-top_x-small slds-text-align_right">
                        <lightning-button
                            variant="brand"
                            label="Send reply"
                            onclick={handleAddComment}
                            disabled={isSendDisabled}
                        ></lightning-button>
                    </div>
                </template>

                <template lwc:if={showFeedbackForm}>
                    <c-case-feedback case-id={caseId} onfeedbacksubmitted={handleFeedbackSubmitted}></c-case-feedback>
                </template>

                <template lwc:if={hasFeedback}>
                    <p class="slds-m-top_medium slds-text-color_success" data-id="feedback-thanks">
                        Thanks for rating this case!
                    </p>
                </template>
            </template>

            <template lwc:else>
                <p class="slds-p-vertical_large slds-text-align_center slds-text-color_weak" data-id="empty">
                    Select a case to see its history.
                </p>
            </template>
        </div>
    </lightning-card>
</template>
