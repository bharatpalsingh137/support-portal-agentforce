name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lwc-tests:
    name: LWC lint and Jest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint LWC
        run: npm run lint

      - name: Jest unit tests with coverage
        run: npm run test:unit:coverage

  code-analyzer:
    name: Salesforce Code Analyzer (PMD and friends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install code-analyzer

      - name: Run Code Analyzer
        run: sf code-analyzer run --workspace force-app --rule-selector Recommended --output-file code-analyzer-results.html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-report
          path: code-analyzer-results.html

  deploy-and-test:
    name: Deploy to scratch org and run Apex tests
    runs-on: ubuntu-latest
    needs: [lwc-tests]
    # Runs only when the Dev Hub secret has been configured (see docs/SETUP.md).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      DEVHUB_SFDX_URL: ${{ secrets.DEVHUB_SFDX_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate Dev Hub
        if: ${{ env.DEVHUB_SFDX_URL != '' }}
        run: |
          echo "$DEVHUB_SFDX_URL" > ./devhub-auth.txt
          sf org login sfdx-url --sfdx-url-file ./devhub-auth.txt --alias devhub --set-default-dev-hub
          rm -f ./devhub-auth.txt

      - name: Create scratch org
        if: ${{ env.DEVHUB_SFDX_URL != '' }}
        run: sf org create scratch --definition-file config/project-scratch-def.json --alias ci-scratch --set-default --duration-days 1 --wait 15

      - name: Deploy source
        if: ${{ env.DEVHUB_SFDX_URL != '' }}
        run: sf project deploy start --source-dir force-app --target-org ci-scratch --wait 30

      - name: Run Apex tests
        if: ${{ env.DEVHUB_SFDX_URL != '' }}
        run: sf apex run test --target-org ci-scratch --test-level RunLocalTests --code-coverage --result-format human --wait 30

      - name: Delete scratch org
        if: ${{ always() && env.DEVHUB_SFDX_URL != '' }}
        run: sf org delete scratch --target-org ci-scratch --no-prompt
